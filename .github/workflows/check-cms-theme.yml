name: Check Our Stories CMS theme isolation
on:
  push:
    paths:
      - 'admin-theme-test/**'
      - '.github/workflows/check-cms-theme.yml'
  pull_request:
    paths:
      - 'admin-theme-test/**'
      - '.github/workflows/check-cms-theme.yml'
jobs:
  static-and-preference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test admin-theme-test/theme-checks.test.cjs
