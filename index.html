 const records=[...(story.records||[])].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 if(!records.length)return '<p class="records-empty">通過記録はまだありません。</p>';
 const columns=[['date','日付'],['scenario','シナリオ名'],['kpc','KPC'],['pc','PC'],['end','エンド']];
 return `<div class="records-wrap"><table class="records-table"><thead><tr>${columns.map(([,name])=>`<th scope="col">${name}</th>`).join('')}</tr></thead><tbody>${records.map(r=>`<tr>${columns.map(([key])=>`<td>${esc(key==='date'?String(r[key]||'').replace(/-/g,'/'):r[key]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const kanaRows=[['あ','あいうえお'],['か','かきくけこがぎぐげご'],['さ','さしすせそざじずぜぞ'],['た','たちつてとだぢづでど'],['な','なにぬねの'],['は','はひふへほばびぶべぼぱぴぷぺぽ'],['ま','まみむめも'],['や','やゆよ'],['ら','らりるれろ'],['わ','わをん']];
const collator=new Intl.Collator('ja',{sensitivity:'base',numeric:true});
function reading(s){return String(s.yomi||s.scenario||'').normalize('NFKC').trim().toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));}
function kanaGroup(s){const first=reading(s).charAt(0);const found=kanaRows.find(([,letters])=>letters.includes(first));return found?found[0]:'その他';}
function homeMarkup(){const sorted=[...stories].sort((a,b)=>collator.compare(reading(a),reading(b))||collator.compare(a.id,b.id));const groups=new Map();for(const s of sorted){const key=kanaGroup(s);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)}
 const card=s=>`<a class="card" href="#/scenario/${esc(s.id)}"><div class="card-image">${art(s.image,'画像',s.tone)}</div><div class="card-name">${esc(s.scenario)}</div></a>`;
 const keys=[...kanaRows.map(r=>r[0]),'その他'];
 return `<div class="collection"><span>SCENARIO COLLECTION</span><small>${stories.length} STORIES</small></div><nav class="kana-index" aria-label="五十音索引">${keys.map(k=>groups.has(k)?`<a href="#kana-${k}" data-kana="${k}">${k}</a>`:`<span aria-label="${k}行は登録なし">${k}</span>`).join('')}</nav>${keys.filter(k=>groups.has(k)).map(k=>`<section class="kana-section" id="kana-${k}"><h2 class="kana-heading">${k==='その他'?'その他':k+'行'}</h2><div class="cards">${groups.get(k).map(card).join('')}</div></section>`).join('')}`;
}
// color は #RRGGBB 形式で指定。薄い背景と読みやすい濃い文字色を自動生成します。
function characterTheme(hex){
 const match=/^#([0-9a-f]{6})$/i.exec(String(hex||''));
 const rgb=match?[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16)):[127,169,165];
 const blend=(target,weight)=>'#'+rgb.map((c,i)=>Math.round(c*(1-weight)+target[i]*weight).toString(16).padStart(2,'0')).join('');
 return `--character-accent:${blend([255,255,255],.08)};--character-deep:${blend([55,47,41],.55)};--character-pale:${blend([255,253,249],.81)}`;
}
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const art=(image,label,tone='',portrait=false)=>image?`<img src="${esc(image)}" alt="${esc(label)}">`:`<div class="${portrait?'portrait-placeholder':'placeholder-image '+esc(tone)}">${esc(label)}</div>`;
function render(){const bits=(location.hash.slice(2)||'').split('/');const kind=bits[0];const story=stories.find(s=>s.id===bits[1]);if(kind==='scenario'&&story){app.innerHTML=`<a class="back" href="#/">← シナリオ一覧へ戻る</a><div class="page-title"><div class="eyebrow">SCENARIO</div><h1>${esc(story.scenario)}</h1><p>${esc(story.description)}</p></div><div class="people">${story.people.map((p,i)=>`<a class="person" href="#/profile/${esc(story.id)}/${esc(p.id)}" style="${characterTheme(p.color)}"><div class="portrait ${i%2?'alt':''}">${art(p.image,'立ち絵',story.tone,true)}</div><h2>${esc(p.name)}</h2><p>${esc(p.label||p.ho||p.role||'')} ・ PROFILE →</p></a>`).join('')}</div><section class="gallery"><div class="section-title">GALLERY / スチル</div><div class="stills-viewport" aria-label="スチル一覧"><div class="stills ${story.stills.length>1?'stills-loop':''}" style="--count:${story.stills.length};--duration:${Math.max(18,story.stills.length*8)}s">${(story.stills.length>1?[...story.stills,...story.stills]:story.stills).map((s,i)=>`<button class="still" data-still="${i%story.stills.length}" ${i>=story.stills.length?'tabindex="-1" aria-hidden="true"':''}><div class="still-thumb">${art(s.image,'画像',story.tone)}</div><small>${esc(s.title)}</small></button>`).join('')}</div></div><section class="session-records" aria-labelledby="session-records-heading"><h2 class="section-title" id="session-records-heading">SESSION RECORDS</h2><p class="records-intro">ふたりが歩んだ物語の記録</p>${recordMarkup(story)}</section></section>`;app.querySelectorAll('[data-still]').forEach(b=>b.addEventListener('click',()=>openStill(story.stills[Number(b.dataset.still)])));}
else if(kind==='profile'&&story){const p=story.people.find(p=>p.id===bits[2]);if(!p){location.hash='#/';return}const fields=[['BIRTHDAY',p.birthday],['AGE',p.age],['HEIGHT',p.height],['OCCUPATION',p.job],['FAMILY',p.family],['LIKES',p.likes],['DISLIKES',p.dislikes]];const statKeys=['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];const stats=p.stats||{};const statMarkup=statKeys.filter(k=>stats[k]!==undefined&&stats[k]!==null&&stats[k]!=='').map(k=>`<div class="status-item"><span class="stat-label">${k}</span><span class="stat-value">${esc(stats[k])}</span></div>`).join('');const csLink=/^https?:\/\//i.test(p.csUrl||'')?`<a class="cs-link" href="${esc(p.csUrl)}" target="_blank" rel="noopener noreferrer">CHARACTER SHEET <span aria-hidden="true">↗</span></a>`:'';app.innerHTML=`<a class="back" href="#/scenario/${esc(story.id)}">← ${esc(story.scenario)} に戻る</a><div class="profile theme-profile" style="${characterTheme(p.color)}"><div class="portrait">${art(p.image,'立ち絵',story.tone,true)}</div><div class="details"><div class="eyebrow">EXPLORER PROFILE</div><div class="profile-name-area"><p class="profile-reading">${esc(p.reading||'')}</p><div class="profile-name-line"><div class="profile-tags">${(p.label||p.ho||p.role)?`<span class="profile-tag">${esc(p.label||p.ho||p.role)}</span>`:''}</div><h1>${esc(p.name)}</h1></div></div>${p.quote?`<p class="profile-quote">${esc(p.quote)}</p>`:''}<dl>${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v||'—')}</dd>`).join('')}</dl><section class="status-panel"><h2 class="status-heading">STATUS</h2>${statMarkup?`<div class="status-grid">${statMarkup}</div>`:`<p class="status-empty">ステータス未登録</p>`}${csLink}</section></div></div>`;}
else{app.innerHTML=homeMarkup();app.querySelectorAll('[data-kana]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById('kana-'+a.dataset.kana)?.scrollIntoView({behavior:reduceMotion.matches?'auto':'smooth',block:'start'});}));}window.scrollTo(0,0)}
const lightbox=document.getElementById('lightbox');let closing=false;
function openStill(s){document.getElementById('dialog-art').innerHTML=art(s.image,'画像');document.getElementById('dialog-caption').textContent=s.title;lightbox.classList.remove('is-closing');closing=false;lightbox.showModal()}
function closeStill(){if(!lightbox.open||closing)return;if(reduceMotion.matches){lightbox.close();return}closing=true;lightbox.classList.add('is-closing');setTimeout(()=>{lightbox.close();lightbox.classList.remove('is-closing');closing=false},220)}
document.getElementById('close').onclick=closeStill;
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeStill()});
lightbox.addEventListener('cancel',e=>{e.preventDefault();closeStill()});// ハッシュ遷移時にコンテンツを滑らかに切り替える（戻る操作にも対応）
let transitionToken=0;
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function navigateSmooth(){
  const token=++transitionToken;
  app.classList.remove('page-enter','page-exit');
  if(reduceMotion.matches){render();return}
  app.classList.add('page-exit');
  setTimeout(()=>{
    if(token!==transitionToken)return;
    render();
    app.classList.remove('page-exit');
    // アニメーションの再実行を保証
    void app.offsetWidth;
    app.classList.add('page-enter');
  },170);
}
app.addEventListener('animationend',e=>{if(e.animationName==='page-enter')app.classList.remove('page-enter')});
window.addEventListener('hashchange',navigateSmooth);render();
// 公開サイトでは Decap CMS が保存した JSON を読み込みます。
// file:// で開いた場合は同梱のサンプルデータでプレビューできます。
if (location.protocol !== 'file:') {
 fetch('./content/stories.json', {cache:'no-store'})
  .then(r => {if(!r.ok) throw new Error('content unavailable');return r.json()})
  .then(data => {if(Array.isArray(data.stories)){stories=data.stories.map(s=>({...s,people:Array.isArray(s.people)?s.people:[],stills:Array.isArray(s.stills)?s.stills:[],records:Array.isArray(s.records)?s.records:[]}));render();}})
  .catch(err => console.warn('CMSデータの読み込みに失敗しました。サンプルを表示します。',err));
}
</script></body></html>
