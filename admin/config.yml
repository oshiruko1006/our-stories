backend:
  name: github
  repo: oshiruko1006/our-stories
  branch: main
  base_url: https://our-stories-oauth.kocco-and-chiri.workers.dev
  auth_endpoint: auth
media_folder: images
public_folder: /images
locale: ja
collections:
- name: pairs
  label: うちよそ管理
  label_singular: うちよそ
  folder: content/pairs
  create: true
  delete: true
  format: json
  extension: json
  identifier_field: id
  slug: '{{id}}'
  summary: '{{scenario}}'
  sortable_fields: [scenario, yomi]
  fields:
  - label: 組み合わせID（自動生成・変更不可）
    name: id
    widget: uuid
    prefix: 'pair-'
    use_b32_encoding: true
    read_only: true
    required: true
  - label: シナリオ名
    name: scenario
    widget: string
    required: true
  - label: ふりがな（五十音順に使用）
    name: yomi
    widget: string
    required: true
  - label: 説明文
    name: description
    widget: text
    required: false
  - label: サムネイル
    name: image
    widget: hidden
    required: false
  - label: 仮画像の色
    name: tone
    widget: select
    required: false
    options:
    - label: ベージュ
      value: ''
    - label: ブルー
      value: blue
    - label: ローズ
      value: rose
  - label: 探索者（2人）
    name: people
    widget: list
    add_to_top: true
    required: true
    min: 2
    max: 2
    summary: '{{fields.label}} {{fields.name}}'
    collapsed: true
    fields:
    - label: 識別ID（自動生成・変更不可）
      name: id
      widget: uuid
      prefix: 'char-'
      use_b32_encoding: true
      read_only: true
      required: true
    - label: 役割
      name: label
      widget: string
      required: false
    - label: 名前
      name: name
      widget: string
      required: true
    - label: ふりがな
      name: reading
      widget: string
      required: false
    - label: イメージカラー（#RRGGBB）
      name: color
      widget: string
      required: false
      default: '#7FA9A5'
    - label: 立ち絵
      name: image
      widget: image
      required: false
    - label: 立ち絵差分
      name: variants
      widget: list
      required: false
      summary: '{{fields.title}}'
      fields:
      - label: 差分名
        name: title
        widget: string
        required: false
      - label: 画像
        name: image
        widget: image
        required: true
    - label: 探索者サムネイル
      name: crop
      widget: string
      required: false
    - label: 一言セリフ
      name: quote
      widget: text
      required: false
    - label: 誕生日
      name: birthday
      widget: string
      required: false
    - label: 年齢
      name: age
      widget: string
      required: false
    - label: 身長
      name: height
      widget: string
      required: false
    - label: 職業
      name: job
      widget: string
      required: false
    - label: 性別
      name: gender
      widget: string
      required: false
    - label: 体重
      name: weight
      widget: string
      required: false
    - label: 出身
      name: origin
      widget: string
      required: false
    - label: 髪の色
      name: hair
      widget: string
      required: false
    - label: 瞳の色
      name: eyes
      widget: string
      required: false
    - label: 肌の色
      name: skin
      widget: string
      required: false
    - label: 家族構成
      name: family
      widget: string
      required: false
    - label: 好き
      name: likes
      widget: string
      required: false
    - label: 苦手
      name: dislikes
      widget: string
      required: false
    - label: ステータス
      name: stats
      widget: object
      collapsed: true
      required: false
      fields:
      - label: STR
        name: STR
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: CON
        name: CON
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: POW
        name: POW
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: DEX
        name: DEX
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: APP
        name: APP
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: SIZ
        name: SIZ
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: INT
        name: INT
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
      - label: EDU
        name: EDU
        widget: number
        required: false
        value_type: int
        min: 0
        max: 999
    - label: いあきゃら公開CS URL（別タブ）
      name: csUrl
      widget: string
      required: false
    - label: 個人のイメージソング
      name: songs
      widget: list
      required: false
      summary: '{{fields.title}}'
      fields:
      - label: 曲名
        name: title
        widget: string
        required: true
      - label: アーティスト名
        name: artist
        widget: string
        required: false
      - label: URL
        name: url
        widget: string
        required: false
      - label: 分類
        name: category
        widget: string
        required: false
      - label: コメント
        name: note
        widget: text
        required: false
  - label: 二人のイメージソング
    name: songs
    widget: list
    required: false
    summary: '{{fields.title}}'
    fields:
    - label: 曲名
      name: title
      widget: string
      required: true
    - label: アーティスト名
      name: artist
      widget: string
      required: false
    - label: URL
      name: url
      widget: string
      required: false
    - label: 分類
      name: category
      widget: string
      required: false
    - label: コメント
      name: note
      widget: text
      required: false
  - label: スチル一覧
    name: stills
    widget: list
    add_to_top: true
    required: false
    summary: '{{fields.title}}'
    fields:
    - label: スチル名
      name: title
      widget: string
      required: true
    - label: 画像
      name: image
      widget: image
      required: false
  - label: SESSION RECORDS
    name: records
    widget: list
    add_to_top: true
    required: false
    summary: '{{fields.date}} / {{fields.scenario}}'
    fields:
    - label: 日付
      name: date
      widget: datetime
      required: true
      format: YYYY-MM-DD
      date_format: YYYY-MM-DD
      time_format: false
    - label: シナリオ名
      name: scenario
      widget: string
      required: true
    - label: KPC
      name: kpc
      widget: string
      required: false
    - label: PC
      name: pc
      widget: string
      required: false
    - label: エンド
      name: end
      widget: string
      required: false
